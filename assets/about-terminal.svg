<svg xmlns="http://www.w3.org/2000/svg" width="620" height="440" viewBox="0 0 620 440" role="img" aria-label="Erfan Dehghani creative engineering terminal illustration">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0C1425"/><stop offset=".52" stop-color="#131A34"/><stop offset="1" stop-color="#1D1635"/></linearGradient>
  <linearGradient id="halo" x1="0" x2="1"><stop stop-color="#62F1E4"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <radialGradient id="orb"><stop stop-color="#62F1E4" stop-opacity=".22"/><stop offset="1" stop-color="#62F1E4" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse"><path d="M27 0H0V27" fill="none" stroke="#A9B9E4" opacity=".065"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
  .pulse{animation:pulse 3.5s ease-in-out infinite;transform-origin:center}
  .blink{animation:blink 1.1s steps(1) infinite}
  .shift{animation:shift 12s linear infinite;transform-origin:484px 245px}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes shift{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.pulse,.blink,.shift{animation:none}}
</style>
